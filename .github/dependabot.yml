version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
    schedule:
      interval: monthly
  - package-ecosystem: pub
    directory: /
    open-pull-requests-limit: 2
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    schedule:
      interval: monthly
