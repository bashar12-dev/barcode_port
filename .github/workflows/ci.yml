name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            version: '3.38.6'
          - name: stable
            version: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ matrix.version }}
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: dart run tool/check_format.dart
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --coverage
      - run: dart run tool/coverage_summary.dart
      - run: flutter pub get
        working-directory: example
      - run: flutter test --no-pub
        working-directory: example
      - run: flutter build apk --debug --no-pub --target-platform android-arm64
        working-directory: example
      - run: dart run tool/smoke_consumer.dart
      - run: flutter test --no-pub --platform chrome test/scanning/platform_support_test.dart
      - run: flutter build web --no-pub
        working-directory: example
      - run: dart run tool/smoke_consumer.dart --platform=web
      - run: dart pub global activate dartdoc 9.0.11
        if: matrix.name == 'stable'
      - run: dart pub global run dartdoc --output .dart_tool/api
        if: matrix.name == 'stable'
      - run: flutter pub publish --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.name }}
          path: |
            coverage/handwritten.info
            coverage/summary.txt
          if-no-files-found: ignore
  platform-builds:
    name: ${{ matrix.target }} / Flutter ${{ matrix.sdk }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: [minimum, stable]
        target: [windows, linux, macos, ios]
        include:
          - sdk: minimum
            version: '3.38.6'
          - sdk: stable
            version: ''
          - target: windows
            os: windows-latest
          - target: linux
            os: ubuntu-latest
          - target: macos
            os: macos-14
          - target: ios
            os: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter test --no-pub
      - run: dart run tool/smoke_consumer.dart --platform=${{ matrix.target }}
  package-score:
    needs: [quality, platform-builds]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub global activate pana
      - name: Install screenshot inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - run: dart run tool/check_pana.dart
