name: barcode_port
description: >-
  Hardware barcode input for Flutter on Android, with keyboard-wedge HID,
  iMin broadcasts, screen lifecycle management, and optional scan processing.
version: 1.0.1
homepage: https://github.com/bashar12-dev/barcode_port
repository: https://github.com/bashar12-dev/barcode_port
issue_tracker: https://github.com/bashar12-dev/barcode_port/issues
documentation: https://github.com/bashar12-dev/barcode_port#readme
topics:
  - barcode
  - scanner
  - hid
  - imin
  - flutter
screenshots:
  - description: BarcodePort example displaying a scan with default processing.
    path: doc/images/example.png
environment:
  sdk: ^3.10.7
  flutter: '>=3.38.6'
dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  pigeon: 26.3.2
flutter:
  plugin:
    platforms:
      android:
        package: com.ultimate.pos.scanner_bridge
        pluginClass: ScannerBridgePlugin
